<script>
    var nums1 = [12, 32, 13, 24, 75], p, q;
    var nums2 = [10, 11, 35, 76, 98];
    var result = [];

    for (p = 0; p < nums1.length; p++) {
        result[p] = nums1[p];
    }

    for (q = 0; q < nums2.length; q++) {
        result[p] = nums2[q];
        p++;
    }

    document.write(result + "<br>");
</script>
